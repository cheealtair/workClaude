name: Build and Publish Learning PDF

on:
  push:
    branches:
      - main
    paths:
      - "Learning.md"
      - "Cover.png"
      - "images/**"
      - ".github/workflows/build-pdf.yaml"

  # Allows manual rebuilding from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ------------------------------------------------------------
      # Install PDF build dependencies
      # ------------------------------------------------------------

      - name: Install Pandoc, LaTeX and fonts
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            poppler-utils \
            fonts-noto-cjk \
            fonts-dejavu-core

      # ------------------------------------------------------------
      # Create output directory
      # ------------------------------------------------------------

      - name: Create publishing directory
        run: |
          mkdir -p _site

      - name: Copy cover image to website
        run: |
          cp Cover.png _site/Cover.png

      # ------------------------------------------------------------
      # Allow deeply nested Markdown lists
      #
      # This protects the build if deeply nested lists are added
      # to Learning.md in the future.
      # ------------------------------------------------------------

      - name: Configure deep nested lists
        run: |
          cat > deep-lists.tex <<'EOF'
          \usepackage{enumitem}

          \setlistdepth{9}

          \renewlist{itemize}{itemize}{9}
          \setlist[itemize]{label=\textbullet,leftmargin=*}

          \renewlist{enumerate}{enumerate}{9}
          \setlist[enumerate,1]{label=\arabic*.}
          \setlist[enumerate,2]{label=\alph*.}
          \setlist[enumerate,3]{label=\roman*.}
          \setlist[enumerate,4]{label=\arabic*.}
          \setlist[enumerate,5]{label=\alph*.}
          \setlist[enumerate,6]{label=\roman*.}
          \setlist[enumerate,7]{label=\arabic*.}
          \setlist[enumerate,8]{label=\alph*.}
          \setlist[enumerate,9]{label=\roman*.}
          EOF

      # ------------------------------------------------------------
      # Remove the manually written GitHub TOC from PDF builds.
      #
      # Learning.md keeps its manual TOC for GitHub readers.
      # Pandoc generates a proper PDF TOC instead.
      #
      # The filter removes:
      #
      #   ## Table of Contents
      #   ...
      #
      # and stops when the first Markdown # heading is reached.
      # ------------------------------------------------------------

      - name: Create PDF TOC filter
        run: |
          cat > strip-manual-toc.lua <<'EOF'
          function Pandoc(doc)
            local out = {}
            local skipping = false
            local removed = false

            for _, block in ipairs(doc.blocks) do

              if not removed
                 and block.t == 'Header'
                 and block.level == 2
                 and pandoc.utils.stringify(block.content) == 'Table of Contents'
              then
                skipping = true
                removed = true

              elseif skipping
                 and block.t == 'Header'
                 and block.level == 1
              then
                skipping = false
                table.insert(out, block)

              elseif not skipping then
                table.insert(out, block)
              end

            end

            return pandoc.Pandoc(out, doc.meta)
          end
          EOF

      # ------------------------------------------------------------
      # Fix the Chapter 2 Individual vs Enterprise table widths.
      # This targets only that specific table.
      # ------------------------------------------------------------
      - name: Configure Chapter 2 table widths
        run: |
          cat > fix-individual-enterprise-table.lua <<'EOF'
          local function cell_text(cell)
            return pandoc.utils.stringify(cell.contents)
          end

          function Table(tbl)
            if #tbl.colspecs ~= 3 then
              return tbl
            end

            if not tbl.head or #tbl.head.rows == 0 then
              return tbl
            end

            local cells = tbl.head.rows[1].cells
            if #cells ~= 3 then
              return tbl
            end

            local c1 = cell_text(cells[1])
            local c2 = cell_text(cells[2])
            local c3 = cell_text(cells[3])

            if c1 == 'Aspect'
               and c2 == 'Individual (personal account)'
               and c3 == 'Enterprise (corporate gateway)'
            then
              tbl.colspecs = {
                { pandoc.AlignDefault, 0.22 },
                { pandoc.AlignDefault, 0.39 },
                { pandoc.AlignDefault, 0.39 }
              }
            end

            return tbl
          end
          EOF

      # ------------------------------------------------------------
      # Build PDF
      #
      # YAML front matter in Learning.md supplies:
      #
      #   title:  Learning Claude Code
      #   author: Clinton Chee (PhD)
      #
      # Heading hierarchy is preserved exactly:
      #
      #   #     Part
      #   ##    Chapter
      #   ###   Section
      #   ####  Subsection
      #
      # No heading-shifting Lua filter is required.
      # ------------------------------------------------------------

      - name: Build Learning.pdf
        run: |
          pandoc Learning.md \
            -o _site/Learning.pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=4 \
            --lua-filter=strip-manual-toc.lua \
            --lua-filter=fix-individual-enterprise-table.lua \
            --include-in-header=deep-lists.tex \
            --resource-path=.:images \
            -V geometry:margin=2cm \
            -V mainfont="Noto Serif CJK KR" \
            -V monofont="DejaVu Sans Mono"

      - name: Prepend Cover.png to Learning.pdf
        run: |
          cat > cover-page.tex <<'EOF'
          \documentclass{article}
          \usepackage[paperwidth=6in,paperheight=9in,margin=0pt]{geometry}
          \usepackage{graphicx}
          \usepackage{eso-pic}
          \pagestyle{empty}

          \begin{document}
          \AddToShipoutPictureBG*{%
            \AtPageLowerLeft{%
              \includegraphics[width=\paperwidth,height=\paperheight]{Cover.png}%
            }%
          }
          \null
          \end{document}
          EOF

          xelatex \
            -interaction=nonstopmode \
            -halt-on-error \
            cover-page.tex

          pdfunite \
            cover-page.pdf \
            _site/Learning.pdf \
            _site/Learning-with-cover.pdf

          mv _site/Learning-with-cover.pdf _site/Learning.pdf

      # ------------------------------------------------------------
      # Verify that PDF was actually created
      # ------------------------------------------------------------

      - name: Verify PDF
        run: |
          test -s _site/Learning.pdf
          echo "Learning.pdf created successfully."
          ls -lh _site/Learning.pdf

      # ------------------------------------------------------------
      # Create GitHub Pages landing page
      # ------------------------------------------------------------

      - name: Create public download page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>Learning Claude Code</title>

            <style>

              body {
                font-family: Arial, sans-serif;
                max-width: 700px;
                margin: 80px auto;
                padding: 0 25px;
                line-height: 1.6;
                text-align: center;
              }

              h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
              }

              p {
                color: #555;
              }

              .button {
                display: inline-block;
                margin: 15px 8px;
                padding: 14px 28px;
                background: #222;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 18px;
              }

              .button:hover {
                background: #444;
              }

              .support {
                margin-top: 35px;
              }

              footer {
                margin-top: 60px;
                color: #888;
                font-size: 14px;
              }

              .cover {
                margin: 40px auto;
              }

              .cover img {
                width: 100%;
                max-width: 360px;
                height: auto;
                border-radius: 6px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.18);
              }

            </style>

          </head>

          <body>

            <h1>Learning Claude Code</h1>

            <p>
              The latest edition is automatically generated
              from the Markdown source on GitHub.
            </p>

            <a
              class="button"
              href="Learning.pdf"
            >
              Download PDF
            </a>
            
            <div class="cover">
            <img
                src="Cover.png"
                alt="Learning Claude Code book cover"
            >
            </div>

            <div class="support">

              <p>
                If you found this book useful:
              </p>

              <a
                class="button"
                href="https://ko-fi.com/learningclaudecode"
                target="_blank"
                rel="noopener noreferrer"
              >
                ? Support this book
              </a>

            </div>

            <footer>
              Generated automatically from Learning.md
            </footer>

          </body>

          </html>
          EOF

      # ------------------------------------------------------------
      # Prepare GitHub Pages
      # ------------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"


  # --------------------------------------------------------------
  # Deploy GitHub Pages
  # --------------------------------------------------------------

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5