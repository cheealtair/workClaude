name: Build and Publish Learning PDF

on:
  push:
    branches:
      - main
    paths:
      - "Learning.md"
      - "images/**"
      - ".github/workflows/build-pdf.yaml"

  # Allows you to rebuild manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-noto-cjk

      - name: Create publishing directory
        run: mkdir -p _site

      - name: Build Learning.pdf
        run: |
          pandoc Learning.md \
            -o _site/Learning.pdf \
            --pdf-engine=xelatex \
            --toc \
            --number-sections \
            -V geometry:margin=2cm \
            -V mainfont="Noto Serif CJK KR"

      - name: Create public download page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Learning</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 700px;
                margin: 80px auto;
                padding: 0 25px;
                line-height: 1.6;
                text-align: center;
              }

              h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
              }

              p {
                color: #555;
              }

              .button {
                display: inline-block;
                margin-top: 25px;
                padding: 14px 28px;
                background: #222;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 18px;
              }

              .button:hover {
                background: #444;
              }

              .support {
                margin-top: 40px;
              }

              footer {
                margin-top: 60px;
                color: #888;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <h1>Learning</h1>

            <p>
              The latest edition is automatically generated
              from the Markdown source on GitHub.
            </p>

            <a class="button" href="Learning.pdf">
              Download PDF
            </a>

            <!--
            Optional contribution link.

            Replace YOURNAME below with your Ko-fi name,
            or replace the whole URL with Buy Me a Coffee.
            -->

            <!--
            <div class="support">
              <p>If you found this book useful:</p>

              <a href="https://ko-fi.com/YOURNAME">
                ? Support this book
              </a>
            </div>
            -->

            <footer>
              Generated automatically from Learning.md
            </footer>

          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4