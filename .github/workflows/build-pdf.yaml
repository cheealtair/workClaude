name: Build and Publish Learning PDF

on:
  push:
    branches:
      - main
    paths:
      - "Learning.md"
      - "images/**"
      - ".github/workflows/build-pdf.yaml"

  # Allows manual rebuilding from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Pandoc, LaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-noto-cjk \
            fonts-dejavu-core

      - name: Create publishing directory
        run: mkdir -p _site

      # Learning.md has lists nested beyond LaTeX's normal limit.
      - name: Configure deep nested lists
        run: |
          cat > deep-lists.tex <<'EOF'
          \usepackage{enumitem}

          \setlistdepth{9}

          \renewlist{itemize}{itemize}{9}
          \setlist[itemize]{label=\textbullet,leftmargin=*}

          \renewlist{enumerate}{enumerate}{9}
          \setlist[enumerate,1]{label=\arabic*.}
          \setlist[enumerate,2]{label=\alph*.}
          \setlist[enumerate,3]{label=\roman*.}
          \setlist[enumerate,4]{label=\arabic*.}
          \setlist[enumerate,5]{label=\alph*.}
          \setlist[enumerate,6]{label=\roman*.}
          \setlist[enumerate,7]{label=\arabic*.}
          \setlist[enumerate,8]{label=\alph*.}
          \setlist[enumerate,9]{label=\roman*.}
          EOF

      # Learning.md contains its own GitHub-friendly Table of Contents.
      # Remove that section only during PDF generation, because Pandoc
      # generates a cleaner PDF TOC automatically.
      - name: Create PDF TOC filter
        run: |
          cat > strip-manual-toc.lua <<'EOF'
          function Pandoc(doc)
            local out = {}
            local skipping = false

            for _, block in ipairs(doc.blocks) do
              if block.t == 'Header'
                 and block.level == 2
                 and pandoc.utils.stringify(block.content) == 'Table of Contents'
              then
                skipping = true

              elseif skipping and block.t == 'HorizontalRule' then
                skipping = false

              elseif not skipping then
                table.insert(out, block)
              end
            end

            return pandoc.Pandoc(out, doc.meta)
          end
          EOF

      - name: Build Learning.pdf
        run: |
          pandoc Learning.md \
            -o _site/Learning.pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=4 \
            --number-sections \
            --lua-filter=strip-manual-toc.lua \
            --include-in-header=deep-lists.tex \
            --resource-path=.:images \
            -V geometry:margin=2cm \
            -V mainfont="Noto Serif CJK KR" \
            -V monofont="DejaVu Sans Mono"

      - name: Create public download page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Learning Claude Code</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 700px;
                margin: 80px auto;
                padding: 0 25px;
                line-height: 1.6;
                text-align: center;
              }

              h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
              }

              p {
                color: #555;
              }

              .button {
                display: inline-block;
                margin-top: 25px;
                padding: 14px 28px;
                background: #222;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 18px;
              }

              .button:hover {
                background: #444;
              }

              .support {
                margin-top: 40px;
              }

              footer {
                margin-top: 60px;
                color: #888;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <h1>Learning Claude Code</h1>

            <p>
              The latest edition is automatically generated
              from the Markdown source on GitHub.
            </p>

            <a class="button" href="Learning.pdf">
              Download PDF
            </a>

            <!--
            Optional support section:

            <div class="support">
              <p>If you found this book useful:</p>

              <a href="https://ko-fi.com/YOURNAME">
                Support this book
              </a>
            </div>
            -->

            <footer>
              Generated automatically from Learning.md
            </footer>

          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5